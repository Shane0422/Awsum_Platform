{% extends "platform/platform_base.html" %}

{% block extra_head %}
<style>
  .page-header {
    background: var(--platform-surface);
    border: 1px solid var(--platform-border);
    border-radius: 1rem;
    padding: 1rem 1.1rem;
    margin-bottom: 1rem;
  }
  .page-header h1 { font-size: 1.2rem; margin: 0; font-weight: 600; }
  .page-header p { margin: 0.35rem 0 0; color: var(--platform-muted); }
  .card-clean {
    background: var(--platform-surface);
    border: 1px solid var(--platform-border);
    border-radius: 1rem;
    box-shadow: 0 8px 20px -18px rgba(15, 23, 42, 0.3);
  }
  .card-stat { border-radius: 1rem; }
</style>
{% endblock %}

{% block page_heading %}
<section class="page-header">
  <h1>{% block dashboard_heading %}Merchant Dashboard{% endblock %}</h1>
  <p>{% block dashboard_subheading %}Store dashboard workspace{% endblock %}</p>
</section>
{% endblock %}
