<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AWSUM PLATFORM | Platform Administration</title>
  <link rel="icon" type="image/png" href="{{ brand_icon_path or '' }}">
  <link rel="stylesheet" href="/static/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/brand.css">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #173451;
      background: linear-gradient(140deg, #edf5fc 0%, #f8fbff 55%, #e8f2fb 100%);
    }

    .admin-login-card {
      width: min(100%, 440px);
      padding: 38px;
      border: 1px solid #e3ebf3;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 22px 60px rgba(24, 53, 82, 0.12);
    }

    .admin-login-logo {
      display: block;
      width: min(245px, 80%);
      max-height: 64px;
      margin: 0 auto 28px;
      object-fit: contain;
    }

    .admin-login-eyebrow {
      margin-bottom: 8px;
      color: #2876bd;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-align: center;
    }

    .admin-login-title {
      margin-bottom: 28px;
      color: #173451;
      font-size: 1.55rem;
      font-weight: 700;
      text-align: center;
    }

    .admin-login-card .form-label {
      color: #304861;
      font-size: 0.87rem;
      font-weight: 600;
    }

    .admin-login-card .form-control {
      min-height: 48px;
      border-color: #dce5ee;
      border-radius: 9px;
      background: #fbfdff;
    }

    .admin-login-card .form-control:focus {
      border-color: #6aa9e2;
      box-shadow: 0 0 0 3px rgba(61, 143, 213, 0.14);
    }

    .admin-login-submit {
      min-height: 48px;
      border: 0;
      border-radius: 9px;
      background: linear-gradient(100deg, #277bc1 0%, #2462a8 100%);
      font-weight: 650;
    }

    .admin-login-home {
      display: block;
      margin-top: 22px;
      color: #5f7892;
      font-size: 0.88rem;
      text-align: center;
      text-decoration: none;
    }

    .admin-login-home:hover {
      color: #2462a8;
    }

    @media (max-width: 480px) {
      .admin-login-card {
        padding: 30px 24px;
      }
    }
  </style>
</head>
<body>
  <main class="admin-login-card">
    <img class="admin-login-logo" src="{{ brand_logo_path or '' }}" alt="{{ brand_display_name }}">
    <p class="admin-login-eyebrow">AWSUM PLATFORM</p>
    <h1 class="admin-login-title">Platform Administration</h1>

    {% if error %}
    <div class="alert alert-danger py-2" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post" action="/platform-admin/login" autocomplete="on">
      <div class="mb-3">
        <label class="form-label" for="platformAdminAccessCode">Access Code</label>
        <input id="platformAdminAccessCode" class="form-control" type="text" name="access_code" placeholder="Admin" autocomplete="off" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="platformAdminEmail">Email</label>
        <input id="platformAdminEmail" class="form-control" type="email" name="email" value="{{ email }}" autocomplete="username" required>
      </div>
      <div class="mb-4">
        <label class="form-label" for="platformAdminPassword">Password</label>
        <input id="platformAdminPassword" class="form-control" type="password" name="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary admin-login-submit w-100" type="submit">Login</button>
    </form>

    <a class="admin-login-home" href="/">Back to AwsumSolution</a>
  </main>
</body>
</html>
