<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ APP_NAME }} - Change Password</title>
  <link rel="stylesheet" href="/static/bootstrap/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center" style="min-height:100vh;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-7 col-lg-5">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h1 class="h4 mb-2">Change Password</h1>
            {% if must_change %}
            <p class="text-muted">For security, you must change your initial password before accessing dashboards.</p>
            {% else %}
            <p class="text-muted">Update your account password.</p>
            {% endif %}

            {% if error %}
            <div class="alert alert-danger" role="alert">{{ error }}</div>
            {% endif %}

            <form method="post" action="/auth/change-password">
              <div class="mb-3">
                <label class="form-label" for="current_password">Current Password</label>
                <input id="current_password" name="current_password" type="password" class="form-control" required>
              </div>

              <div class="mb-3">
                <label class="form-label" for="new_password">New Password</label>
                <input id="new_password" name="new_password" type="password" class="form-control" required>
              </div>

              <div class="mb-3">
                <label class="form-label" for="confirm_password">Confirm New Password</label>
                <input id="confirm_password" name="confirm_password" type="password" class="form-control" required>
              </div>

              <div class="d-grid gap-2">
                <button type="submit" class="btn btn-dark">Save New Password</button>
                <a href="/auth/logout" class="btn btn-outline-secondary">Logout</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
