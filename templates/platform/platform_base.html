<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ APP_NAME }} - {% block page_title %}Platform{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ brand_icon_path }}">
  <link rel="stylesheet" href="/static/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/brand.css">
  <script src="/static/bootstrap/js/bootstrap.bundle.min.js"></script>
  <style>
    :root {
      --platform-bg: #f4f6f9;
      --platform-surface: #ffffff;
      --platform-border: #d7dde6;
      --platform-text: #111827;
      --platform-muted: #6b7280;
      --sidebar-bg: #2f3542;
      --sidebar-border: #434a58;
      --sidebar-text: #d5dbe5;
      --sidebar-text-strong: #f8fafc;
      --sidebar-hover: #3a4250;
      --sidebar-active: #455063;
      --sidebar-accent: #93a7c5;
      --topbar-height: 52px;
      --sidebar-width: 232px;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--platform-bg);
      color: var(--platform-text);
      font-size: 14px;
    }

    .platform-shell {
      min-height: 100vh;
    }

    .platform-topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--topbar-height);
      padding: 0 1rem;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--platform-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      z-index: 1000;
      backdrop-filter: blur(8px);
    }

    .platform-topbar .brand-mark {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
    }

    .platform-topbar .brand-icon {
      --aw-brand-icon-size: 22px;
    }

    .platform-topbar .brand-text {
      --aw-brand-text-size: 0.94rem;
      color: #1f2937;
      font-weight: 600;
    }

    .platform-topbar .topbar-meta {
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    #userDropdown {
      font-size: 0.8rem;
      padding: 0.22rem 0.58rem;
      border-color: #cfd6df;
      color: #344054;
    }

    #platformDateTime {
      font-size: 0.78rem;
      color: #6b7280 !important;
      white-space: nowrap;
    }

    .platform-sidebar {
      position: fixed;
      top: var(--topbar-height);
      left: 0;
      bottom: 0;
      width: var(--sidebar-width);
      background: var(--sidebar-bg);
      border-right: 1px solid var(--sidebar-border);
      padding: 0.72rem;
      overflow-y: auto;
      z-index: 950;
    }

    .platform-sidebar .sidebar-title {
      font-size: 0.73rem;
      color: #a8b3c5;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 0.15rem 0 0.55rem;
      padding: 0 0.45rem;
    }

    .platform-sidebar .sidebar-menu {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .platform-sidebar .sidebar-link {
      position: relative;
      display: flex;
      align-items: center;
      height: 38px;
      border-radius: 9px;
      padding: 0 0.62rem;
      color: var(--sidebar-text);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.01em;
      transition: background-color 0.16s ease, color 0.16s ease;
    }

    .platform-sidebar .sidebar-link:hover {
      background: var(--sidebar-hover);
      color: var(--sidebar-text-strong);
    }

    .platform-sidebar .sidebar-link.active {
      background: var(--sidebar-active);
      color: var(--sidebar-text-strong);
    }

    .platform-sidebar .sidebar-link.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 8px;
      bottom: 8px;
      width: 2px;
      border-radius: 99px;
      background: var(--sidebar-accent);
    }

    .platform-main {
      margin-top: var(--topbar-height);
      margin-left: var(--sidebar-width);
      min-height: calc(100vh - var(--topbar-height));
      padding: 0.95rem 1.1rem 1.1rem;
    }

    .platform-view {
      max-width: 1680px;
      margin: 0 auto;
    }

    .card-modern {
      border: 1px solid var(--platform-border);
      border-radius: 12px;
      background: var(--platform-surface);
      box-shadow: 0 12px 22px -20px rgba(15, 23, 42, 0.4);
    }

    .btn-modern {
      border-radius: 8px;
      font-size: 0.84rem;
      padding: 0.31rem 0.7rem;
    }

    .no-scrollbar::-webkit-scrollbar {
      width: 8px;
    }
    .no-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(15, 23, 42, 0.2);
      border-radius: 999px;
    }

    @media (max-width: 992px) {
      .platform-sidebar {
        position: static;
        width: 100%;
        top: 0;
        bottom: auto;
        border-right: 0;
        border-bottom: 1px solid var(--sidebar-border);
        padding: 0.55rem;
      }

      .platform-sidebar .sidebar-menu {
        flex-direction: row;
        flex-wrap: nowrap;
        overflow-x: auto;
      }

      .platform-main {
        margin-left: 0;
        padding: 0.85rem;
      }

      #platformDateTime {
        display: none;
      }
    }
  </style>
</head>
<body class="{% if active_page %}page-{{ active_page }}{% endif %}{% if active_module %} module-{{ active_module }}{% endif %}">
  <div class="platform-shell">
    <header class="platform-topbar">
      <a href="/platform/dashboard" class="brand-mark" aria-label="{{ APP_NAME }}">
        <img src="{{ brand_icon_path }}" alt="{{ brand_display_name }}" class="brand-icon">
        <span class="brand-text">{{ brand_display_name }}</span>
      </a>

      <div class="topbar-meta">
        <span id="platformDateTime"></span>
        <div class="dropdown">
          <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
            {{ user.c_first_name }} {{ user.c_last_name }}
          </button>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
            <li><h6 class="dropdown-header">{{ user.c_first_name }} {{ user.c_last_name }}</h6></li>
            <li><span class="dropdown-item-text text-muted">{{ role }}</span></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="/settings">Settings</a></li>
            <li><a class="dropdown-item" href="/auth/logout">Logout</a></li>
          </ul>
        </div>
      </div>
    </header>

    <aside class="platform-sidebar no-scrollbar">
      <div class="sidebar-title">Platform</div>
      <ul class="sidebar-menu">
        <li>
          <a class="sidebar-link{% if active_page == 'dashboard' %} active{% endif %}" href="/platform/dashboard">Dashboard</a>
        </li>
        <li>
          <a class="sidebar-link{% if active_page == 'master' and active_module == 'client' %} active{% endif %}" href="/platform/master/client">Clients</a>
        </li>
        <li>
          <a class="sidebar-link{% if active_page == 'master' and active_module == 'business-type' %} active{% endif %}" href="/platform/master/business-type">Business Types</a>
        </li>
        <li>
          <a class="sidebar-link{% if active_page == 'master' and active_module == 'role' %} active{% endif %}" href="/platform/master/role">Roles</a>
        </li>
        <li>
          <a class="sidebar-link{% if active_page == 'master' and active_module == 'user' %} active{% endif %}" href="/platform/master/user">Users</a>
        </li>
        <li>
          <a class="sidebar-link{% if active_page == 'master' and active_module == 'session' %} active{% endif %}" href="/platform/master/session">Sessions</a>
        </li>
      </ul>
    </aside>

    <main class="platform-main">
      <div class="platform-view">
        {% block content %}{% endblock %}
      </div>
    </main>

  </div>

  <script>
    function formatPlatformDateTime(date) {
      const monthNames = [
        'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
        'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'
      ];
      const month = monthNames[date.getMonth()];
      const day = String(date.getDate()).padStart(2, '0');
      const year = date.getFullYear();

      const hours24 = date.getHours();
      const minutes = String(date.getMinutes()).padStart(2, '0');
      const period = hours24 >= 12 ? 'PM' : 'AM';
      const hours12 = String((hours24 % 12) || 12).padStart(2, '0');

      return `${month} ${day}, ${year} ${hours12}:${minutes} ${period}`;
    }

    function updateDateTime() {
      const now = new Date();
      const formatted = formatPlatformDateTime(now);
      document.getElementById('platformDateTime').textContent = formatted;
    }

    updateDateTime();
    setInterval(updateDateTime, 60 * 1000);
  </script>
</body>
</html>
